name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk fitness_tracker.apk

      # Keep a single rolling "latest" release whose tag always points at
      # the commit that produced the APK.
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force origin HEAD:refs/tags/latest
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest APK" \
              --notes "Auto-built from the latest commit on main."
          fi
          gh release upload latest fitness_tracker.apk --clobber
          gh release edit latest --latest \
            --notes "Auto-built from ${GITHUB_SHA} on main."
